name: AlGzawy BETA static contracts
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'loaders/**', 'catalog.json', 'tests/**', '.github/workflows/beta-contracts.yml']
  pull_request:
    paths: ['scripts/**', 'loaders/**', 'catalog.json', 'tests/**', '.github/workflows/beta-contracts.yml']
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/auto-builder-pro-algzawy-v3-3-fixed-queue.js
      - run: node --test tests/algzawy-beta-contracts.test.mjs
