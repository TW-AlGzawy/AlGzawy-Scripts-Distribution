name: Smart Defense Ultimate v2.1 QA

on:
  push:
    branches: [qa/smart-defense-ultimate-v210-20261028]
    paths:
      - pilots/algzawy-smart-defense-ultimate-v2.1.0-qa.user.js
      - tests/smart-defense-ultimate-v210.test.mjs
      - tests/smart-defense-ultimate-v210-smoke.cjs
      - .github/workflows/smart-defense-ultimate-v210-qa.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check pilots/algzawy-smart-defense-ultimate-v2.1.0-qa.user.js
      - name: Noble and UI regressions
        run: node --test tests/smart-defense-ultimate-v210.test.mjs
      - name: UI smoke
        run: node tests/smart-defense-ultimate-v210-smoke.cjs
