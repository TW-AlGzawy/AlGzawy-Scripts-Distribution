name: AlGzawy Cloud Portal checks
on:
  push:
    paths:
      - "portal/**"
      - "catalog.json"
      - "loaders/algzawy-cloud-bridge.user.js"
      - "loaders/smart-defense-ultimate.user.js"
      - "scripts/smart-defense-ultimate.js"
      - "tests/smart-defense-official-215*.test.mjs"
      - "tests/portal-contract.test.mjs"
      - "tests/portal-v2-contract.test.mjs"
      - "tests/portal-quality.test.mjs"
      - "tests/portal-licensing-static.test.mjs"
      - ".github/workflows/algzawy-portal-ci.yml"
  pull_request:
    paths:
      - "portal/**"
      - "catalog.json"
      - "loaders/algzawy-cloud-bridge.user.js"
      - "loaders/smart-defense-ultimate.user.js"
      - "scripts/smart-defense-ultimate.js"
      - "tests/smart-defense-official-215*.test.mjs"
      - "tests/portal-contract.test.mjs"
      - "tests/portal-v2-contract.test.mjs"
      - "tests/portal-quality.test.mjs"
      - ".github/workflows/algzawy-portal-ci.yml"
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check portal/assets/app.js
          node --check portal/admin/admin.js
          node --check portal/v2/app.js
          node --check "portal/functions/api/[[path]].js"
          node --check loaders/algzawy-cloud-bridge.user.js
          node --check loaders/smart-defense-ultimate.user.js
          node --check scripts/smart-defense-ultimate.js
      - name: Portal and D1 contract tests
        run: node --test tests/portal-contract.test.mjs tests/portal-v2-contract.test.mjs tests/portal-quality.test.mjs
      - name: Licensing and free-polling regression checks
        run: node --test tests/portal-licensing-static.test.mjs
      - name: Smart Defense 2.1.5 QA precision and lifecycle regressions
        run: node --test tests/smart-defense-official-215.test.mjs tests/smart-defense-official-215-lifecycle.test.mjs
