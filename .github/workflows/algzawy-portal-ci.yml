name: AlGzawy Cloud Portal checks
on:
  push:
    paths:
      - "portal/**"
      - "pilots/**"
      - "extension/**"
      - "tests/alg-cloud-ecosystem.test.mjs"
      - "loaders/algzawy-cloud-bridge.user.js"
      - "tests/portal-contract.test.mjs"
      - "tests/portal-licensing-static.test.mjs"
      - ".github/workflows/algzawy-portal-ci.yml"
  pull_request:
    paths:
      - "portal/**"
      - "pilots/**"
      - "extension/**"
      - "tests/alg-cloud-ecosystem.test.mjs"
      - "loaders/algzawy-cloud-bridge.user.js"
      - "tests/portal-contract.test.mjs"
      - ".github/workflows/algzawy-portal-ci.yml"
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check portal/assets/app.js
          node --check portal/admin/admin.js
          node --check "portal/functions/api/[[path]].js"
          node --check loaders/algzawy-cloud-bridge.user.js
          node --check portal/v2/app.js
          node --check pilots/algzawy-smart-launcher-v1.user.js
          node --check extension/popup.js
      - name: Portal and D1 contract tests
        run: node --test tests/portal-contract.test.mjs
      - name: Licensing and free-polling regression checks
        run: node --test tests/portal-licensing-static.test.mjs
      - name: AlG Cloud Ecosystem QA and V2 contracts
        run: |
          node --test tests/portal-v2-contract.test.mjs
          node --test tests/alg-cloud-ecosystem.test.mjs
